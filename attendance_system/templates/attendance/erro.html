{% extends "base.html" %}
{% block title %}Erro — UFVJM QR{% endblock %}
{% block topbar_title %}Erro{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto;text-align:center;" class="fade-in">
  <div style="font-size:3.5rem;margin-bottom:20px;color:var(--red)">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h2 style="font-family:var(--font-head);font-size:1.4rem;font-weight:800;margin-bottom:10px;">
    QR Code Inválido
  </h2>
  <p class="text-muted" style="font-size:.85rem;line-height:1.7;margin-bottom:28px;">
    {{ mensagem }}
  </p>
  <a href="{% url 'dashboard' %}" class="btn btn-outline">
    <i class="fa-solid fa-house"></i> Voltar ao Dashboard
  </a>
</div>
{% endblock %}
